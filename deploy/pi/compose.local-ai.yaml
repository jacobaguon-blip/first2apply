# Local-AI stack: f2a-edge-local (self-hosted Supabase edge runtime) on the Pi,
# bound to localhost / Tailscale only (never publicly exposed). It calls the
# f2a-codex-shim systemd unit (deploy/pi/codex-shim) for inference. Ollama was
# removed 2026-10-29, see deploy/pi/CHANGELOG.md. Brought up alongside the
# existing f2a-server-probe systemd unit.
#
# Bring up:        docker compose -f compose.local-ai.yaml up -d
# Bring down:      docker compose -f compose.local-ai.yaml down
# Recreate only edge (picks up .env changes): docker compose -f compose.local-ai.yaml up -d --no-deps --force-recreate edge
#
# Volume mounts are bind-mounted from /opt/first2apply-mono (rsync'd from the
# repo) so updates to the edge functions are picked up with a `restart edge`.

name: f2a-local-ai

services:
  edge:
    image: denoland/deno:latest
    container_name: f2a-edge-local
    restart: unless-stopped
    network_mode: host
    working_dir: /mono/apps/backend/supabase/functions
    env_file: /opt/first2apply-mono/apps/backend/supabase/functions/.env
    volumes:
      - /opt/first2apply-mono:/mono
    command: deno run --allow-all _localServer.ts
